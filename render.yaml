services:
  - type: web
    name: project-atlas-api
    runtime: python
    buildCommand: pip install . && python -m scripts.cache_embedding_model
    startCommand: bash ./scripts/start_production.sh
    healthCheckPath: /ready
    envVars:
      - key: FORWARDED_ALLOW_IPS
        value: "*"
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: ATLAS_EMBEDDING_MODEL
        value: BAAI/bge-small-en-v1.5
      - key: ATLAS_EMBEDDING_DIMENSIONS
        value: "384"
      - key: ATLAS_EMBEDDING_CACHE_DIR
        value: ./.cache/fastembed
      - key: ATLAS_QDRANT_COLLECTION
        value: atlas_chunks_semantic_v1
      - key: ATLAS_INDEX_VERSION
        value: "3"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: "openai/gpt-oss-120b"
      - key: FAST_RERANK
        value: "1"
      - key: FRONTEND_URL
        sync: false
